<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>دورات DentaCollab</title>

    <style>
        :root {
            color-scheme: light;
            --navy: #101c38;
            --cyan: #1fb6d1;
            --muted: #66758b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: clamp(12px, 3vw, 36px);
            background:
                radial-gradient(circle at top right, #dff6fb, transparent 45%),
                #f4f7fb;
            color: var(--navy);
            font-family: Tahoma, Arial, sans-serif;
        }

        .courses-card {
            width: min(1440px, 100%);
            margin-inline: auto;
            overflow: hidden;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 65px rgb(16 28 56 / 9%);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            padding: 24px 28px;
            background:
                radial-gradient(circle at top left, #1fb6d133, transparent 60%),
                var(--navy);
            color: white;
        }

        .brand {
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #7be7ff;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(20px, 3vw, 28px);
        }

        .description {
            margin: 0;
            color: #c3cfe0;
            font-size: 14px;
            line-height: 1.9;
        }

        .open-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 44px;
            padding: 12px 20px;
            border: 1px solid #ffffff40;
            border-radius: 14px;
            color: white;
            background: #ffffff0d;
            text-decoration: none;
            font-size: 13px;
            white-space: nowrap;
            transition: background 180ms ease;
        }

        .open-link:hover {
            background: #ffffff20;
        }

        a:focus-visible {
            outline: 3px solid var(--cyan);
            outline-offset: 4px;
        }

        .frame-container {
            background: #fff;
        }

        iframe {
            display: block;
            width: 100%;
            height: 80vh;
            height: 80dvh;
            min-height: 480px;
            border: 0;
            background: #fff;
        }

        .card-footer {
            padding: 14px 24px;
            border-top: 1px solid var(--border);
            background: #f8fafc;
            color: var(--muted);
            text-align: center;
            font-size: 12px;
            line-height: 1.9;
        }

        .card-footer a {
            color: #087e96;
            font-weight: 700;
            text-underline-offset: 3px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .courses-card {
                border-radius: 18px;
            }

            .card-header {
                padding: 20px;
            }

            .open-link {
                width: 100%;
            }

            iframe {
                height: 75vh;
                height: 75dvh;
                min-height: 420px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .open-link {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="courses-card">
        <header class="card-header">
            <div>
                <div class="brand">
                    <bdi>DENTACOLLAB ACADEMY</bdi>
                </div>

                <h1>اكتشف دورات طب الأسنان الرقمي</h1>

                <p class="description">
                    تصفّح البرامج التدريبية وتعرّف على تفاصيل كل دورة.
                </p>
            </div>

            <a class="open-link" href="https://www.dentacollab.org/courses" target="_blank" rel="noopener noreferrer">
                فتح في نافذة جديدة
                <span aria-hidden="true">↗</span>
            </a>
        </header>

        <div class="frame-container">
            <iframe src="https://www.dentacollab.org/courses" title="دورات أكاديمية DentaCollab"
                referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen"></iframe>
        </div>

        <footer class="card-footer">
            إذا لم تظهر الصفحة أو تعذّر إكمال التسجيل،
            <a href="https://www.dentacollab.org/courses" target="_blank" rel="noopener noreferrer">
                افتح الدورات مباشرة
            </a>.
        </footer>
    </main>
</body>

</html>
