name: dentacollab
description: "DentaCollab Digital Dentistry Academy Student App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  cloud_firestore: ^5.5.1
  firebase_auth: ^5.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
